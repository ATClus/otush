name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-test-clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libasound2-dev libssl-dev \
            libvulkan-dev glslc glslang-tools spirv-headers spirv-tools libopenblas-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build:
    runs-on: ubuntu-24.04
    needs: check-test-clippy
    steps:
      - uses: actions/checkout@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev \
            libasound2-dev libssl-dev \
            libvulkan-dev glslc glslang-tools spirv-headers spirv-tools libopenblas-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: otush-linux-x86_64
          path: target/release/otush

      - name: Build deb (cargo-deb)
        run: |
          cargo install cargo-deb --locked
          cargo deb
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: otush-deb
          path: target/debian/*.deb
