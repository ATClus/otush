[package]
name = "otush"
version = "1.7.1"
description = "Otush - the native AI voice and productivity suite for GNOME"
authors = ["Otush contributors"]
edition = "2021"
license = "MIT"
default-run = "otush"

[lib]
name = "otush"
crate-type = ["rlib"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
symphonia = { version = "0.5.4", features = ["all"] }
log = "0.4.25"
env_filter = "0.1.0"
tokio = "1.43.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
earshot = "1.2.2"
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "multipart"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
base64 = "0.22"
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "0.16"
isolang = "2"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"
sha2 = "0.10"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere).
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.0", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
gtk4 = "0.11.4"
libadwaita = { version = "0.9", features = ["v1_3", "v1_4"] }
gdk4 = "0.11.4"
pangocairo = "0.22"
glib = "0.22.8"
dirs = "6.0.0"
opener = "0.8.5"
ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
ksni = { version = "0.3", features = ["blocking"] }
arboard = "3"
image = "0.25"
gio = "0.22"
async-channel = "2"
evdev = "0.12"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[package.metadata.deb]
name = "otush"
maintainer = "Otush contributors <otush@clusterat.com>"
maintainer-scripts = "packaging/debian"
copyright = "2026 Otush contributors"
license-file = ["LICENSE", "4"]
extended-description = """\
Otush is a native GNOME (GTK4/libadwaita) AI voice and productivity suite for Linux, featuring speech-to-text, meeting intelligence, notes, tasks, document OCR, and deep web research."""
depends = "libgtk-4-1, libadwaita-1-0, libopenblas0, libasound2, libssl3, libvulkan1"
section = "sound"
priority = "optional"
assets = [
    ["target/release/otush", "usr/bin/otush", "755"],
    ["packaging/com.clusterat.otush.desktop", "usr/share/applications/com.clusterat.otush.desktop", "644"],
    ["resources/otush-128.png", "usr/share/icons/hicolor/128x128/apps/com.clusterat.otush.png", "644"],
    ["resources/otush-icon.svg", "usr/share/icons/hicolor/scalable/apps/com.clusterat.otush.svg", "644"],
    ["resources/transcribe-libs/*", "usr/share/otush/resources/transcribe-libs/", "644"],
    ["resources/models/*", "usr/share/otush/resources/models/", "644"],
    ["resources/default_settings.json", "usr/share/otush/resources/", "644"],
    ["resources/*.png", "usr/share/otush/resources/", "644"],
    ["resources/*.wav", "usr/share/otush/resources/", "644"],
]
