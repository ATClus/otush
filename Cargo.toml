[package]
name = "otush"
version = "1.0.0"
description = "Otush - a free, open source, offline speech-to-text application for GNOME"
authors = ["Otush contributors"]
edition = "2021"
license = "MIT"
default-run = "otush"

[lib]
name = "otush"
crate-type = ["rlib"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[dependencies]
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev" }
cpal = "0.16.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
tokio = "1.43.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
earshot = "1.2.2"
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git" }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "0.16"
isolang = "2"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere).
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.0", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }
evdev-keys = { package = "handy-keys", version = "0.3.4" }
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = [
  "tokio",
] }
gtk4 = "0.11.4"
libadwaita = { version = "0.9", features = ["v1_3", "v1_4"] }
gtk4-layer-shell = "0.8.1"
gdk4 = "0.11.4"
glib = "0.22.8"
dirs = "6.0.0"
opener = "0.8.5"
ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
ksni = { version = "0.3", features = ["blocking"] }
arboard = "3"
image = "0.25"
gio = "0.22"
async-channel = "2"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }
